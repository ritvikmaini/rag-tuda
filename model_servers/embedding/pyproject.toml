# The embedding server: its own uv project, outside the workspace. On linux x86_64 the lock installs exactly the pinned set;
# `dependencies` are the packages the server needs plus those the image holds without anything requiring them (python-box,
# typer and its tree); `constraint-dependencies` is the image's installed set (pip and wheel aside: a uv environment has no
# installer). tests/repo/test_model_servers.py checks it. A version changes on its own: its pin here, then
# `uv lock --project model_servers/embedding`.

[project]
name = "embedding-server"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.136.0",
  "huggingface-hub==0.36.2",
  "langchain-huggingface==0.3.1",
  "markdown-it-py==4.0.0",
  "mdurl==0.1.2",
  "pygments==2.20.0",
  "python-box==7.4.1",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "sentence-transformers==4.1.0",
  "setuptools==81.0.0",
  "shellingham==1.5.4",
  "torch==2.11.0",
  "transformers==4.51.3",
  "typer==0.24.1",
  "uvicorn==0.44.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
