# the two sdists of the indexer's set (antlr4-python3-runtime, pylatexenc) build with these pinned versions
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0"]

[dependency-groups]
# Development tools; their versions are free (they never reach a service image).
dev = ["pytest", "pytest-asyncio", "pytest-cov", "hypothesis==6.168.5", "ruff", "basedpyright", "import-linter", "deptry",
       "psycopg[binary]",  # the harness tests' SQL client
       "jsonschema"]  # the stream schema's contract test

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
markers = ["local_crawl: reads the crawl and snapshots of a local build under .rag (skipped without them)"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff's classic default rules, named: ruff 0.16 widened its defaults (pyupgrade, simplify, ruff-specific, ...), which
# would rewrite much of the code; more rules are added here in a change of their own.
select = ["E4", "E7", "E9", "F"]

[tool.basedpyright]
include = ["packages", "apps", "tests/evals", "tests/rag_core", "tests/profiles", "tests/contracts", "tests/rag_testing",
           "tests/integration"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["packages/rag_core"]

[tool.importlinter]
root_packages = ["rag_core", "evals", "rag_testing", "indexer", "assistant_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core-not-apps: rag_core imports no app"
type = "forbidden"
source_modules = ["rag_core"]
forbidden_modules = ["evals", "indexer", "assistant_api"]

[[tool.importlinter.contracts]]
name = "fastapi-in-apps: rag_core imports no web framework"
type = "forbidden"
source_modules = ["rag_core"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "testing-dev-only: no package or app imports rag_testing"
type = "forbidden"
source_modules = ["rag_core", "evals", "indexer", "assistant_api"]
forbidden_modules = ["rag_testing"]

[[tool.importlinter.contracts]]
name = "domain-is-pure: rag_core.domain imports no framework, I/O library or upper layer"
type = "forbidden"
source_modules = ["rag_core.domain"]
forbidden_modules = ["fastapi", "starlette", "langgraph", "langchain_core", "langchain_postgres", "langchain_text_splitters",
                     "psycopg", "sqlalchemy", "httpx", "openai", "langfuse", "rag_core.adapters", "rag_core.ports",
                     "rag_core.settings"]

[[tool.importlinter.contracts]]
name = "core-layers"
type = "layers"
layers = ["rag_core.adapters", "rag_core.ports", "rag_core.domain"]

[[tool.importlinter.contracts]]
name = "apps-independent"
type = "independence"
modules = ["indexer", "evals", "assistant_api"]

[[tool.importlinter.contracts]]
name = "langchain-contained (the text splitters stay in indexer.chunking)"
type = "forbidden"
source_modules = ["rag_core", "assistant_api", "indexer", "evals"]
forbidden_modules = ["langgraph", "langchain", "langchain_core", "langchain_postgres", "langchain_text_splitters", "langchain_openai"]
# measured with lint-imports (external packages are squashed to their top-level name)
ignore_imports = [
  "indexer.chunking.** -> langchain_text_splitters",
  "assistant_api.graph.** -> langgraph",
  "assistant_api.graph.** -> langchain_core",
  "rag_core.adapters.chat_openai -> langchain_core",  # the one place that builds the chat model
  "rag_core.adapters.chat_openai -> langchain_openai",
]

[[tool.importlinter.contracts]]
name = "migrations-contained"
type = "forbidden"
# Alembic and SQLAlchemy only in the migrate one-shot: the request path stays on psycopg
source_modules = ["assistant_api.app", "assistant_api.runtime", "assistant_api.api", "assistant_api.chat",
                  "assistant_api.graph", "assistant_api.sse", "assistant_api.retention", "rag_core"]
forbidden_modules = ["alembic", "sqlalchemy"]
