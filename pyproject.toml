# The root project is the command line (`rag`): standard library only, so `uv run rag doctor` installs nothing heavy. It is also
# the uv workspace root; the members are the packages and the apps, the model servers are their own projects.

[project]
name = "rag-tuda"
version = "0.1.0"
description = "A local assistant with cited answers over the TU Darmstadt Informatik pages"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rag = "rag_tuda.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_tuda"

[tool.uv.workspace]
members = ["packages/rag_core", "packages/rag_testing", "apps/evals", "apps/indexer", "apps/assistant_api"]
# the GPU model servers are their own uv projects with their own locks
exclude = ["model_servers/*"]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# On Python 3.12 the resolver would build zstandard 0.23.0's sdist for its metadata, and its build pin setuptools<69 clashes
# with build-constraint-dependencies; its wheels cover every environment. Goes when langsmith's zstandard moves.
no-build-package = ["zstandard"]
# docling 2.89 and its parts cap pillow<13; the override lifts the cap for pillow 13.0.0 (the constraint below holds the
# version). Goes with a docling upgrade whose releases allow pillow 13.
override-dependencies = ["pillow<14"]
# Every package a service image carries, at one version: members declare ranges, the lock takes these versions, and a
