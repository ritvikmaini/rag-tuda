[project]
name = "assistant-api"
version = "0.1.0"
description = "The assistant API (FastAPI, LangGraph): GET /api/chat and its ops routes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rag-core[assistant,db,http]",  # db: psycopg (adapters.db), http: httpx
  "fastapi>=0.136,<0.137", "fastapi-cli>=0.0.24,<0.0.25", "gunicorn>=22,<23", "uvicorn>=0.44,<0.45", "slowapi>=0.1.9,<0.2",
  "httpx>=0.28,<0.29", "pydantic>=2.9,<3", "pyyaml>=6.0,<7", "python-box>=7.1,<8", "tiktoken>=0.12,<0.13", "xxhash>=3.6,<4",
  "langfuse>=4.17,<5", "langchain>=1.4,<2", "langchain-core>=1.6,<2", "langchain-openai>=1.1,<2",
  "langgraph>=1.2,<2", "langgraph-checkpoint>=4.2,<5", "langgraph-prebuilt>=1.1,<2",
  "langgraph-sdk>=0.4,<0.5", "psycopg[binary]>=3.3,<4", "psycopg-pool>=3.2,<4", "pgvector>=0.2.5,<0.3",
  "typing-extensions>=4.12,<5",  # graph/state.py: LangGraph needs typing_extensions.TypedDict on Python 3.11
  "alembic>=1.20,<1.21",  # migrations of the assistant's own tables, the migrate one-shot only
  "sqlalchemy>=2.0.49,<2.0.50",  # Alembic's engine, not used on the request path (the import contract keeps it off)
]

[tool.deptry.per_rule_ignores]
# installed without a direct import (gunicorn and uvicorn run as the server)
DEP002 = [
    "fastapi-cli",
    "gunicorn",
    "httpx",
    "langchain",
    "langchain-openai",
    "langgraph-sdk",
    "pgvector",
    "python-box",
    "tiktoken",
    "uvicorn",
    "xxhash",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
