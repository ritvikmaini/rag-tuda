# a quarter of the container's 4G limit: shared buffers count toward it once touched, and a build of the full index
# (writing ~2.5 GB plus the HNSW build in maintenance_work_mem) was OOM-killed with 4GB
shared_buffers = 1GB
work_mem = 256MB
effective_cache_size = 8GB
maintenance_work_mem = 1GB
# The apps connect directly: the backend's index-read pools (at most 20 connections each, two while an index reload swaps) and
# the turn store's (4), the indexer's few. Well under the limit.
max_connections = 200
max_parallel_workers_per_gather = 4
jit = off
listen_addresses = '*'
# the tracked client authentication: the superuser only on the socket and loopback
hba_file = '/etc/postgresql/pg_hba.conf'

# pgvector HNSW settings - increase ef_search for better recall
# Higher value = better recall but slower queries (default is ~40)
hnsw.ef_search = 200
