# pgvector's client authentication, mounted read-only and named by
# postgresql.conf's hba_file. The maintenance superuser (vector_user, named by secrets/vector_user.txt) logs in over the socket
# and on loopback only (docker exec ... psql, pg_isready); every other login uses SCRAM over the network. The
# cluster's own pg_hba.conf in the data volume is not used here; leave it in place (an older compose file reads it).
# TYPE  DATABASE     USER         ADDRESS        METHOD
local   all          all                         trust
host    all          all          127.0.0.1/32   trust
host    all          all          ::1/128        trust
local   replication  all                         trust
host    replication  all          127.0.0.1/32   trust
host    replication  all          ::1/128        trust
host    all          vector_user  all            reject
host    all          all          all            scram-sha-256
