# The rag-tuda stack, project rag-tuda, run from the repository root with the root .env (`rag up --mode compose` writes
# .rag/compose.env instead and runs the steps below):
#   docker compose --env-file .env -f deploy/compose.yaml <command> <service>
# Variables, each with a default so the file renders without an env file: RAG__CARD (the backend's model card),
# OLLAMA_CONTEXT_LENGTH (the card's window), RAG_ROLES_DIR (the folder of the database secret files, <name>.txt),
# BACKEND_REFRESH_TOKEN (the backend's Bearer token), RAG_PROFILE (the profile the images are built with) and
# RAG_INDEXER_OVERLAY (the indexer's overlay file; the default names the example profile's law texts).
# This file runs on the CPU with Ollama as the language model server; the only host port is the backend's, on 127.0.0.1.
#   -f deploy/compose.nvidia.yaml   adds the GPUs to the embedding, reranker and Ollama services
#   -f deploy/compose.vllm.yaml     replaces Ollama by vLLM (name it last)
# Ollama starts without a model: pull the card's once, after the first `up` (the card's download_gb is the size):
#   docker compose --env-file .env -f deploy/compose.yaml exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
# Paths are relative to this folder (deploy/).

name: rag-tuda

x-logging: &default-logging
  # local driver: json-file logs did not stay readable across a reboot
  driver: local
  options:
    max-size: "50m"
    max-file: "5"

services:

  # --- Backend (RAG engine) ---
  backend:
    restart: unless-stopped
    stop_signal: SIGQUIT
    build:
      context: ..
      dockerfile: apps/assistant_api/Dockerfile
      args:
        PROFILE: ${RAG_PROFILE:-example}
    logging: *default-logging
    ports:
      - "127.0.0.1:8700:8000"
    volumes:
      - ../data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - OPENAI_API_KEY=not-needed
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      # the assistant's technical settings: RAG__<SECTION>__<KEY>
      - RAG__DATABASE__HOST=pgvector
      - RAG__DATABASE__PORT=5432
      # the card's url names the host's Ollama; RAG__LLM_URL moves its local endpoints to the compose service
      - RAG__CARD=${RAG__CARD:-s-qwen3-4b-instruct-2507}
      - RAG__LLM_URL=http://ollama:11434/v1
      - RAG__MODEL_SERVERS__EMBEDDING_URL=http://embedding_service:8001
      - RAG__MODEL_SERVERS__RERANKER_URL=http://reranker_service:8003
      - RAG__COMPUTE__SLOT_WAIT_S=30
      - RAG__TIMEOUTS__RETRIEVAL_S=10
      - RAG__TIMEOUTS__PARENT_LOOKUP_S=5
      - RAG__TIMEOUTS__RERANKER_S=15
      - RAG__TRACING__URL=   # empty: tracing is off (Langfuse needs this URL and its key files)
    secrets:
      - source: rag_app_password
        target: pg_vector_password
      - source: rag_app_user
        target: vector_user
      - pgdatabase
      - backend_token
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Migrate: the assistant's migrations, a one-off of the backend image. Run it after the build and before the
  # backend's up; profile migrate, so up never starts it ---
  migrate:
    image: rag-tuda-backend:latest
    profiles: [migrate]
    command: ["python", "-m", "assistant_api.migrate"]
    logging: *default-logging
    environment:
      - RAG_MIGRATE_HOST=pgvector
    secrets:
      - pgdatabase
      - rag_migrator_password

  # --- Embedding Service ---
  embedding_service:
    restart: unless-stopped
    build:
      context: ../model_servers/embedding
    logging: *default-logging
    volumes:
      - ${RAG_HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_DISABLE_XET=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
    healthcheck:
      # /readyz: the start-up reference check, cached (no GPU work per probe)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  # --- Reranker Service ---
  reranker_service:
    restart: unless-stopped
    build:
      context: ../model_servers/reranker
    logging: *default-logging
    volumes:
      - ${RAG_HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - HF_HUB_DISABLE_XET=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
    healthcheck:
      # /readyz: the start-up reference check, cached (no GPU work per probe)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/readyz', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --- Ollama (language model server, CPU): no host port, reached by the backend as http://ollama:11434. The context
  # length is the card's effective window, so a prompt is not cut at Ollama's default ---
  ollama:
    image: docker.io/ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8000}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- pgvector (PostgreSQL) ---
  pgvector:
    restart: unless-stopped
    image: docker.io/pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    logging: *default-logging
    shm_size: '2g'
    environment:
      - POSTGRES_DB_FILE=/run/secrets/pgdatabase
      - POSTGRES_USER_FILE=/run/secrets/vector_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_vector_password
    volumes:
      - ./pgvector/init:/docker-entrypoint-initdb.d
      - ./pgvector/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./pgvector/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - db-data:/var/lib/postgresql/data:rw
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    secrets:
      - pg_vector_password
      - pgdatabase
      - vector_user
      - rag_indexer_password
      - rag_app_password
      - rag_migrator_password
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U vector_user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Indexer (data ingestion): a one-off, never started by up (profile build):
  #   docker compose --env-file .env -f deploy/compose.yaml --profile build run --rm indexer build ---
  indexer:
    profiles: [build]
    build: {context: .., dockerfile: apps/indexer/Dockerfile, args: {PROFILE: "${RAG_PROFILE:-example}"}}
    logging: *default-logging
    volumes:
      - ../data:/app/data
      # the crawl and its snapshots live in .rag/ like the native stack's, where `rag down --purge` deletes them
      - ../.rag/crawl:/app/data/crawl
      - ../.rag/snapshots:/app/data/snapshots
      - ../logs:/app/logs
      - ${RAG_HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ~/.cache/docling:/root/.cache/docling
      - ~/.EasyOCR:/root/.EasyOCR
      # the profile's own files (the folder sources read them) and the overlay that names the folders
      - ../profiles/${RAG_PROFILE:-example}:/app/profiles/${RAG_PROFILE:-example}:ro
      - ${RAG_INDEXER_OVERLAY:-./env/compose-indexer.yaml}:/app/overlay.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - HF_HUB_DISABLE_XET=1
      - RAG_OVERLAY=/app/overlay.yaml
      # the crawled PDFs and the text extracted from them sit in the crawl folder
      - RAG__PATHS__PDF_DIR=/app/data/crawl/pdfs
      - RAG__PATHS__EXTRACTED_DIR=/app/data/crawl/extracted
      # the user's own crawl contact for the user agent: passed through when the shell that runs compose has it
      - RAG__CRAWL__CONTACT
    secrets:
      - source: rag_indexer_password
        target: pg_vector_password
      - source: rag_indexer_user
        target: vector_user
      - pgdatabase
    depends_on:
      pgvector:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 1G

  # --- Evals job: probe runs, gate and smoke against the backend over HTTP ---
  # Never started by `up` (profile evals). Every invocation, by name and without --rm:
  #   docker compose --env-file .env -f deploy/compose.yaml --profile evals run --no-deps --name evals-run evals <command>
  #   docker cp evals-run:/app/out/. data/eval_runs/   (the job writes into its own /app/out; data/eval_runs is read-only)
  #   docker rm evals-run
  # Docker refuses a second container of that name, so one probe run at a time.
  evals:
    profiles: [evals]
    build:
      context: ..
      dockerfile: apps/evals/Dockerfile
      args:
        PROFILE: "${RAG_PROFILE:-example}"
    logging: *default-logging
    volumes:
      - ../data/eval_runs:/app/data/eval_runs:ro
    environment:
      - TZ=Europe/Berlin
      - OPENAI_API_KEY=not-needed
    secrets:
      - backend_token

volumes:
  db-data:
  ollama-models:

secrets:
  pg_vector_password:
    file: ${RAG_ROLES_DIR:-../secrets}/pg_vector_password.txt
  pgdatabase:
    file: ${RAG_ROLES_DIR:-../secrets}/pgdatabase.txt
  vector_user:
    file: ${RAG_ROLES_DIR:-../secrets}/vector_user.txt
  rag_indexer_password:
    file: ${RAG_ROLES_DIR:-../secrets}/rag_indexer_password.txt
  rag_app_password:
    file: ${RAG_ROLES_DIR:-../secrets}/rag_app_password.txt
  rag_migrator_password:
    file: ${RAG_ROLES_DIR:-../secrets}/rag_migrator_password.txt
  rag_indexer_user:
    file: ./pgvector/roles/rag_indexer.txt
  rag_app_user:
    file: ./pgvector/roles/rag_app.txt
  backend_token:
    environment: BACKEND_REFRESH_TOKEN   # from .env; mounted into the backend and the evals job as /run/secrets/backend_token
