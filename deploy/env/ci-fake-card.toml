# The harness's model card: the fake LLM of deploy/compose.ci.yaml, which answers as the vLLM server it replaces. The window is
# the one the fake reports from /tokenize; the foreign-script strip is on so the harness covers it; the silence limit is short
# so the guard tests finish in seconds, and the request deadline leaves room for the iterative round (the follow-up search runs
# only while more than analysis_s + 30 s are left).
name = "ci-fake"
class = "M"
structured_output = "json_object"
chars_per_token = 2.0
prompt_overlay = "large"
slots = 1

[answer]
provider = "vllm"
url = "http://vllm:8000/v1"
model = "Qwen/Qwen3-14B-AWQ"
context_window = 8192

[budget]
window_tokens = 8192
answer_tokens = 900
# the retrieval and history sizes the harness's tests expect (the class M defaults are larger)
final_k = 14
full_sources = 3
history_turns = 2
history_tokens = 1200
max_queries = 6

[timeouts]
deadline_s = 90
idle_s = 5
llm_read_s = 60
analysis_s = 20

[quirks]
strip_cjk = true
