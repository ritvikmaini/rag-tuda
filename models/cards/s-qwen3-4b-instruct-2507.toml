# Qwen3 4B Instruct 2507 on Ollama; answers without a thinking block, the default of class S
name = "s-qwen3-4b-instruct-2507"
class = "S"
# Ollama turns the schema into a grammar, so every analysis reply is valid JSON of the schema (strict true or false)
structured_output = "json_schema"
chars_per_token = 3.3
prompt_overlay = "small"
slots = 1
download_gb = 2.5

[answer]
provider = "ollama"
url = "http://127.0.0.1:11434/v1"
model = "qwen3:4b-instruct-2507-q4_K_M"
context_window = 262144

[budget]
window_tokens = 8000
answer_tokens = 700

[reasoning]
answer = "off"
analysis = "off"

# measured on an M2 Pro with 16 GB, Ollama 0.40.17: a full 8000-token window (7.5K prompt tokens) prefills at about 365 tokens/s and
# decodes at about 36 tokens/s: the first token comes after 21 s and a 700-token answer ends after 41 s (a cold model load adds
# 1 s); an analysis that is not answered from the prompt cache takes 9 s including the load.
# The limits are not tied to the slowest model case: idle_s also bounds the silence of one get_docs call, whose stage
# timeouts add up to about 57 s (retrieval 10 + 2 s, parent lookup 5 s, reranker 15 s, then the reference hop's 5 + 5 + 15 s), so
# they leave room for the stack's own waits; the full window's first token (at most 21 s) stays under half of idle_s.
[timeouts]
deadline_s = 150
idle_s = 60
llm_read_s = 60
analysis_s = 40
retries = 1
