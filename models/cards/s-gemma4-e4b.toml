# Gemma 4 E4B on Ollama; Ollama 0.40.17 answers HTTP 501 to any response_format for this model: the prompt asks for JSON and the
# lenient parser reads it
name = "s-gemma4-e4b"
class = "S"
structured_output = "prompt"
chars_per_token = 3.3
prompt_overlay = "small"
slots = 1
download_gb = 9.5

[answer]
provider = "ollama"
url = "http://127.0.0.1:11434/v1"
model = "gemma4:e4b"
context_window = 131072

[budget]
window_tokens = 8000
answer_tokens = 700

[reasoning]
answer = "off"
analysis = "off"

# measured on an M2 Pro with 16 GB, Ollama 0.40.17 (the model takes 9.5 GB of the 10.4 GB usable): a full 8000-token window
# (7.3K prompt tokens) prefills at about 570 tokens/s and decodes at about 41 tokens/s: the first token comes after 18 s and a
# 700-token answer ends after 35 s (a cold model load adds 5 s); an analysis that is not answered from the prompt cache takes
# 12 s including the load.
# The limits are not tied to the slowest model case: idle_s also bounds the silence of one get_docs call, whose stage
# timeouts add up to about 57 s (retrieval 10 + 2 s, parent lookup 5 s, reranker 15 s, then the reference hop's 5 + 5 + 15 s), so
# they leave room for the stack's own waits; the full window's first token (at most 21 s) stays under half of idle_s.
[timeouts]
deadline_s = 150
idle_s = 60
llm_read_s = 60
analysis_s = 40
retries = 1
