# The crawl's host allow-list; every other host is refused. A core host is built by every build, a full host only by a
# full build; a core host with a `full` block lists more pages in a full build. Prefixes are URL paths.
# www.darmstadt.de (Darmstadt's main site) and h-da.de are never listed.
# Selectors: `main` is the element a host's pages keep their content in (alternatives are tried in the order written),
# `section` the element a page splits into documents at. The statutes of gesetze-im-internet.de are not crawled as pages;
# they come from the official XML (`laws`, read by the law connector through the same fetcher, so the host is on the
# allow-list and robots.txt applies).
hosts:
  www.informatik.tu-darmstadt.de:
    set: core
    # the Ordnungen hubs of the three programmes, the Studienbüro pages and the promotion page; discovery then takes the
    # whole study area (programme pages, FAQ, knowledge base) from the sitemap, less the other programmes' hubs and pages
    seeds:
      - https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_bsc_informatik.de.jsp
      - https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_msc_informatik.de.jsp
      - https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_cs.de.jsp
      - https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/studienbuero/index.de.jsp
      - https://www.informatik.tu-darmstadt.de/forschung_fb20/wissenschaftliche_karriere/promotion/index.de.jsp
    sitemap: [https://www.informatik.tu-darmstadt.de/sitemap.de.xml]
    prefixes:
      - /studium_fb20/
      - /forschung_fb20/wissenschaftliche_karriere/promotion/
      # the PDFs of those pages: one media folder per programme, and the promotion documents
      - /media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_bsc/
      - /media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_msc/
      - /media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/
      - /media/informatik/fb20_dekanat/dokumente_promotion/
    # the other programmes: their Ordnungen hubs and their programme pages
    exclude:
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/informatik_lehramt_an_gymnasien
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/itsecurity_msc
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_aim
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_asur
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_autonome_systeme
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_internet_und_webbasierte
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_it_sicherheit
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_mdss
      - /studium_fb20/im_studium/formulare_und_dokumente/ordnungen/ordnungen_visual_computing
      - /studium_fb20/im_studium/studiengaenge_liste/aim_msc
      - /studium_fb20/im_studium/studiengaenge_liste/asur_msc
      - /studium_fb20/im_studium/studiengaenge_liste/autonome_systeme_msc
      - /studium_fb20/im_studium/studiengaenge_liste/entrace_examination_mdss
      - /studium_fb20/im_studium/studiengaenge_liste/informatik_lehramt_an_gymnasien
      - /studium_fb20/im_studium/studiengaenge_liste/internet__und_web_basierte_systeme
      - /studium_fb20/im_studium/studiengaenge_liste/itsecurity_msc
      - /studium_fb20/im_studium/studiengaenge_liste/visual_computing_fb20
    depth: 1
    twins: true
    # .main-column holds the content of the hub and article pages; the programme pages have no such element, so their
    # <main> is taken
    selectors: {main: ".main-column, main", section: "section.content-section", drop: null}
  www.intern.tu-darmstadt.de:
    set: core
    # the APB, the Einschreibeordnung and the Promotionsordnung with their English information versions: the sitemap lists
    # no PDF, so depth 1 reaches the PDFs the seed links; the login-gated paragraphs of the page are skipped by the crawler
    seeds:
      - https://www.intern.tu-darmstadt.de/verwaltung/dez_ii/hochschulrecht/gesetze_und_ordnungen/index.de.jsp
    sitemap: [https://www.intern.tu-darmstadt.de/sitemap.de.xml]
    prefixes: [/verwaltung/dez_ii/hochschulrecht/gesetze_und_ordnungen/, /media/dezernat_ii/ordnungen/]
    exclude: []
    depth: 1
    twins: false
    selectors: {main: "main, .main-column, #content", section: "section.content-section", drop: null}
  www.tu-darmstadt.de:
    set: core
    # core: listed pages only (semester dates, re-registration and fee, the residence pages for international students)
    seeds:
      - https://www.tu-darmstadt.de/studieren/studierende_tu/semestermine/index.de.jsp
      - https://www.tu-darmstadt.de/studieren/studieren_von_a_bis_z/artikel_details_de_en_286144.de.jsp
      - https://www.tu-darmstadt.de/studieren/studierende_tu/internationale_studierende_1/aufenthalt_international/artikel_details_de_en_204992.de.jsp
      - https://www.tu-darmstadt.de/studieren/studierende_tu/internationale_studierende_1/aufenthalt_international/artikel_details_de_en_269184.en.jsp
    sitemap: []
    prefixes: []
    exclude: []
    depth: 0
    twins: true
    selectors: {main: "main, .main-column, #content", section: "section.content-section", drop: null}
    # full: the TU-wide study rules, found through the sitemap, and the PDFs those pages link (forms, leaflets and
    # checklists of the study and exchange pages; one media folder, no other)
    full:
      sitemap: [https://www.tu-darmstadt.de/sitemap.de.xml]
      prefixes:
        - /studieren/studierende_tu/
        - /studieren/studieren_von_a_bis_z/
        - /media/daa_responsives_design/02_studium_medien/
      exclude: []
      depth: 0
  digitales-rathaus.darmstadt.de:
    set: core
    # Aufenthaltserlaubnis zum Studium, the Ausländerbehörde category page and Anmeldung; listed pages only, since the
    # category links to more than 60 services
    seeds:
      - https://digitales-rathaus.darmstadt.de/kategorien/aemter-und-einrichtungen/aufenthaltserlaubnis-zum-studium
      - https://digitales-rathaus.darmstadt.de/kategorien/aemter-und-einrichtungen/buerger-und-ordnungsamt-abt-auslaender-und-staatsangehoerigkeitswesen-sachgebiet-auslaenderbehoerde
      - https://digitales-rathaus.darmstadt.de/lebensbereiche/umzug-zuzug/dienstleistungen/anmeldung-ummeldung-des-wohnsitzes
    sitemap: []
    prefixes: []
    exclude: []
    depth: 0
    twins: false
    # the page's content sits in .page-container, between the header and the footer; the page has no <main>
    selectors: {main: ".page-container", section: "section.content-section", drop: null}
  www.ladadi.de:
    set: full
    # the Ausländerwesen pages for students who live in the Landkreis, and the forms and leaflets they link
    seeds: [https://www.ladadi.de/umwelt-soziales/migration/auslaenderwesen/]
    sitemap: [https://www.ladadi.de/sitemap.xml]
    prefixes: [/umwelt-soziales/migration/auslaenderwesen/, /medien/pdfs/fb-510-auslaenderwesen-visum/]
    exclude: []
    depth: 0
    twins: false
    selectors: {main: "main, #content, .main-column", section: "section.content-section", drop: null}
  www.gesetze-im-internet.de:
    set: core
    # no pages: the host lists nothing for the web crawl and serves the XML of the `laws` below
    seeds: []
    sitemap: []
    prefixes: []
    exclude: []
    depth: 0
    twins: false
    # unused
    selectors: {main: body, section: "section.content-section", drop: null}
# the norms the residence pages and the questions of international students refer to; both XML paths answer 200 and hold the norms named by `start` and `end`
laws:
  - title: Aufenthaltsgesetz (AufenthG), § 16b Studium
    kind: Gesetz
    xml_url: https://www.gesetze-im-internet.de/aufenthg_2004/xml.zip
    page_url: https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html
    start: "§ 16b"
    end: "§ 16b"
  - title: Aufenthaltsverordnung (AufenthV), § 45
    kind: Verordnung
    xml_url: https://www.gesetze-im-internet.de/aufenthv/xml.zip
    page_url: https://www.gesetze-im-internet.de/aufenthv/__45.html
    start: "§ 45"
    end: "§ 45"
# the English counterparts of German PDFs (a pair is both PDFs of one text: they share the German URL as their twin key); a
# renamed file loses its pair, which is then indexed twice
pdf_twins:
  - {de: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/apb.pdf, en: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/apb-english.pdf}
  - {de: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/ESO_3._Novelle__2025-04-30.pdf, en: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/ESO_englisch.pdf}
  - {de: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/promotionsordnung.pdf, en: https://www.intern.tu-darmstadt.de/media/dezernat_ii/ordnungen/Promotionsordnung-en.pdf}
  - de: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/Studien-_und_Pruefungsplan_M_Sc_Computer_Science_PO_2023.de.pdf
    en: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/Studien-_und_Pruefungsplan_M_Sc_Computer_Science_PO_2023.en.pdf
  - de: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/ordnung_des_studiengangs_m_sc_computer_science_po_2023_14045087.de.pdf
    en: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/ordnung_des_studiengangs_m_sc_computer_science_po_2023_14045087.en.pdf
  - de: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/2023_05_11_MHB_MSC_CS.de.pdf
    en: https://www.informatik.tu-darmstadt.de/media/informatik/fb20_studium/formulare_und_dokumente/ordnungen/ordnungen_cs/pruefungsordnungen_cs_2023/2023_05_11_MHB_MSC_CS.en.pdf
