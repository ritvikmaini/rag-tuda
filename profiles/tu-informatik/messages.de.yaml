# The TU Informatik profile's user-facing German texts. question.too_long takes {limit}, the limit with a thousands dot.
guard:
  not_ready: Der Assistent wird gerade aktualisiert und ist in wenigen Minuten wieder für Sie da.
  busy: Gerade sind sehr viele Anfragen gleichzeitig eingegangen. Bitte versuchen Sie es in einem Moment noch einmal.
  error: Entschuldigung, bei der Beantwortung ist ein technischer Fehler aufgetreten. Bitte versuchen Sie es in einem Moment noch einmal.
  timeout: Die Antwort dauert gerade ungewöhnlich lange, deshalb habe ich abgebrochen. Bitte stellen Sie Ihre Frage in ein paar Minuten noch einmal.
question:
  too_long: "Ihre Nachricht ist leider zu lang für mich (höchstens {limit} Zeichen). Bitte kürzen Sie Ihre Frage auf das Wesentliche oder stellen Sie mehrere kürzere Fragen nacheinander, dann helfe ich Ihnen gern weiter."
variant:
  refused: Diese Umwandlung ist nur für die letzte Antwort mit Quellen möglich.
answer:
  unavailable: Entschuldigung, der KI-Assistent ist derzeit leider nicht verfügbar. Bitte versuchen Sie es später erneut.
  context_too_long: Entschuldigung, die Frage und die gefundenen Dokumente waren zusammen zu umfangreich für eine Antwort. Bitte stellen Sie die Frage kürzer oder beginnen Sie ein neues Gespräch.
  past_event: Der in den Dokumenten genannte Termin, {dates}, ist bereits vorbei
  past_events: Die in den Dokumenten genannten Termine, {dates}, sind bereits vorbei
  no_newer_event: "; einen neueren Termin nennen die Dokumente nicht"
  # the lines the prompt gets about status groups and PO versions; {groups}: the labels compared, {versions}: the PO years
  scope_compare: "Die Frage vergleicht {groups}. Nenne für jede Gruppe ihre Regel und sage, wo sich die Regeln unterscheiden."
  scope_differ: "Die Quellen gelten für unterschiedliche Gruppen oder Studiengänge. Sage bei jeder Regel, für wen sie gilt, und nenne die Unterschiede."
  scope_versions: "Die Quellen gehören zu den Prüfungsordnungen {versions}. Sage bei jeder Regel, für welche Version sie gilt, und nenne die Unterschiede zwischen den Versionen."
  version_table: "Nennt deine Antwort mehr als eine Version einer Prüfungsordnung, stelle die Versionen zusätzlich nebeneinander in einer Tabelle dar: eine Zeile je Version."
  # appended to an answer from the sources it cites: the PO versions ({entries}, {version}, {programme}), the note on an English
  # translation, the disclaimer on a residence source
  po_line: "Grundlage: {entries}"
  po_line_term: "Grundlage (in der Regel): {entries}"
  po_one: "Prüfungsordnung {version}"
  po_programme: "{entry} des {programme}"
  non_binding: "Nicht rechtsverbindlich: Die zitierte Quelle ist eine englische Informationsübersetzung. Verbindlich ist der deutsche Text."
  visa_disclaimer: "Keine Rechtsberatung. Verbindlich entscheidet die zuständige Ausländerbehörde (Stadt Darmstadt oder Landkreis Darmstadt-Dieburg, je nach Wohnort)."
  # closes an answer to a search that found nothing under a filter; {filter}, {first}, {rest}: what the filter names
  no_match: "Für {filter} habe ich nichts gefunden."
  no_match_more: "Für {first}, {rest}, habe ich nichts gefunden."
  filter_programmes: "den {labels}"
  filter_bachelor: den Bachelor
  filter_master: den Master
  filter_promotion: die Promotion
  filter_po: "PO {years}"
docs:
  none: "Hinweis: Für die Antwort wurden keine Quellen benutzt!"
# Where a source comes from, in its header and its citation: the type first, then the metadata origin, then the url's host.
labels:
  source_types: {}
  origins: {}
  hosts:
    www.informatik.tu-darmstadt.de: Fachbereich Informatik, TU Darmstadt
    www.intern.tu-darmstadt.de: Hochschulrecht, TU Darmstadt
    www.tu-darmstadt.de: TU Darmstadt
    digitales-rathaus.darmstadt.de: Digitales Rathaus Darmstadt
    www.ladadi.de: Landkreis Darmstadt-Dieburg
    www.gesetze-im-internet.de: Gesetze im Internet
  scope: Geltungsbereich laut Dokument  # the source header's line for a document's own scope statement
