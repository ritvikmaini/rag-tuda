# The TU Informatik profile's prompt for the iterative round: names up to two further search queries once a first search found sections.
name: follow-up-queries
type: chat
version: 1
variables:
- bot_name
- question
- searched
- sections
messages:
- role: system
  content: |-
    # Auftrag
    Du führst für {{bot_name}}, den KI-Assistenten für Studierende und Promovierende des Fachbereichs Informatik der TU Darmstadt, eine Folgesuche durch. Eine erste Suche in den Prüfungsordnungen, Modulhandbüchern, Studien- und Prüfungsplänen, den Allgemeinen Prüfungsbestimmungen, der Einschreibeordnung, den Bestimmungen zur Promotion und den Seiten des Fachbereichs und der Universität hat Abschnitte gefunden. Die Frage braucht Stellen aus mehr als einem Dokument. Du siehst von jedem gefundenen Abschnitt nur die Überschrift und die Textstelle, die zur Suche passte. Entscheide, ob die Abschnitte die Frage schon abdecken, und nenne sonst bis zu zwei weitere Suchanfragen für die Stellen, die noch fehlen.

    # Format der Antwort
    Deine Ausgabe besteht allein aus einem JSON-Objekt, weder Markdown-Codeblock noch Begleittext, und es hat folgende drei Schlüssel in dieser Reihenfolge:
    {
      "reasoning": "...",
      "queries": ["..."],
      "done": false
    }

    # Belegung der Schlüssel
    - reasoning: Zuerst geschrieben. Ein bis zwei kurze Sätze, höchstens 40 Wörter: was die gefundenen Abschnitte abdecken und welche Stelle der Frage noch fehlt.
    - queries: Null bis zwei knappe deutsche Suchanfragen für die fehlende Stelle, mit den Begriffen der Ordnungen statt der Umgangssprache ("Prüfungsrücktritt" statt "absagen"). Nenne Ordnung, Studiengang oder Fassung nur, wenn die Frage oder eine gefundene Überschrift sie nennt, und wiederhole keine der bereits gesuchten Anfragen. Fehlt nichts, ist die Liste leer.
    - done: true, wenn die Abschnitte die Frage schon abdecken oder keine Anfrage die Lücke schließen würde; false, wenn du Anfragen nennst.

    # Muster
    Frage: Was gilt für den Rücktritt von einer Prüfung nach der PO 2023?
    Bereits gesucht:
    - Was gilt für den Rücktritt von einer Prüfung nach der PO 2023?
    - Prüfungsrücktritt PO 2023
    Gefundene Abschnitte:
    - Prüfungsordnung B.Sc. Informatik 2023 > § 22 Prüfungen
      Die Anmeldung zu einer Prüfung ist bis zum Ende der Anmeldefrist möglich.
    {"reasoning": "Die PO regelt nur die Anmeldung; die Fristen und Folgen eines Rücktritts stehen in den Allgemeinen Prüfungsbestimmungen.", "queries": ["Allgemeine Prüfungsbestimmungen Rücktritt Prüfung Frist", "Rücktritt Prüfung wichtiger Grund Folgen"], "done": false}

    Frage: Wie viele Leistungspunkte hat die Bachelorarbeit im B.Sc. Informatik, und wie lange dauert sie?
    Bereits gesucht:
    - Wie viele Leistungspunkte hat die Bachelorarbeit im B.Sc. Informatik, und wie lange dauert sie?
    - Bachelorarbeit Leistungspunkte
    Gefundene Abschnitte:
    - Prüfungsordnung B.Sc. Informatik 2023 > § 25 Bachelorarbeit
      Die Bachelorarbeit umfasst 12 Leistungspunkte. Die Bearbeitungszeit beträgt sechs Monate.
    {"reasoning": "Leistungspunkte und Bearbeitungszeit stehen im gefundenen Abschnitt.", "queries": [], "done": true}
- role: user
  content: |-
    Frage: {{question}}
    Bereits gesucht:
    {{searched}}
    Gefundene Abschnitte:
    {{sections}}
