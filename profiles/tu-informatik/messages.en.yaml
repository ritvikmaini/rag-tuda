# The TU Informatik profile's user-facing English texts, for the questions asked in English. question.too_long takes
# {limit}, the limit with a thousands separator.
guard:
  not_ready: The assistant is being updated and will be back for you in a few minutes.
  busy: Many requests have arrived at once. Please try again in a moment.
  error: Sorry, a technical error occurred while answering. Please try again in a moment.
  timeout: The answer is taking unusually long, so I stopped. Please ask your question again in a few minutes.
question:
  too_long: "Your message is too long for me (at most {limit} characters). Please shorten your question to the essentials or ask several shorter questions one after another, and I will gladly help."
variant:
  refused: This conversion is only possible for the last answer with sources.
answer:
  unavailable: Sorry, the AI assistant is currently not available. Please try again later.
  context_too_long: Sorry, the question and the documents found were together too long for an answer. Please shorten the question or start a new conversation.
  past_event: The date named in the documents, {dates}, has already passed
  past_events: The dates named in the documents, {dates}, have already passed
  no_newer_event: "; the documents name no later date"
  # the lines the prompt gets about status groups and PO versions; {groups}: the labels compared, {versions}: the PO years
  scope_compare: "The question compares {groups}. Give each group's rule and say where the rules differ."
  scope_differ: "The sources apply to different groups or programmes. For each rule, say whom it applies to and name the differences."
  scope_versions: "The sources belong to the examination regulations {versions}. For each rule, say which version it applies to and name the differences between the versions."
  version_table: "If your answer cites more than one version of an examination regulation, also show the versions side by side in a table: one row per version."
  # appended to an answer from the sources it cites: the PO versions ({entries}, {version}, {programme}), the note on an English
  # translation, the disclaimer on a residence source
  po_line: "Based on: {entries}"
  po_line_term: "Based on (as a rule): {entries}"
  po_one: "Examination regulations {version}"
  po_programme: "{entry} of the {programme}"
  non_binding: "Not legally binding: the cited source is an English information translation. The German text is binding."
  visa_disclaimer: "No legal advice. The competent immigration authority (City of Darmstadt or District of Darmstadt-Dieburg, depending on your place of residence) has the final say."
  # closes an answer to a search that found nothing under a filter; {filter}, {first}, {rest}: what the filter names
  no_match: "I found nothing for {filter}."
  no_match_more: "I found nothing for {first}, {rest}."
  filter_programmes: "the {labels}"
  filter_bachelor: the Bachelor
  filter_master: the Master
  filter_promotion: the doctorate
  filter_po: "PO {years}"
docs:
  none: "Note: No sources were used for this answer!"
labels:
  source_types: {}
  origins: {documents: Your own documents}
  hosts:
    www.informatik.tu-darmstadt.de: Department of Computer Science, TU Darmstadt
    www.intern.tu-darmstadt.de: University regulations, TU Darmstadt
    www.tu-darmstadt.de: TU Darmstadt
    digitales-rathaus.darmstadt.de: Digital Town Hall of Darmstadt
    www.ladadi.de: District of Darmstadt-Dieburg
    www.gesetze-im-internet.de: Gesetze im Internet
  scope: Scope according to the document  # the source header's line for a document's own scope statement
  # the words that frame the sources in the prompt: the line before them ({n}: how many), what a search that found nothing
  # gives instead, and the names of a header's date and page fields and of the line before a link
  sources_lead: "There are {n} sources:"
  nothing_found: "No relevant information was found."
  date: As of
  page: Page
  link: Link
# The same lines for an answer in English.
shapes:
  table: '- Form: Begin with one sentence that answers the question. Then present the comparison as a Markdown table: one row per option, one column per feature, at most 6 rows and 4 columns, and as the last column Source with the source numbers of the row, for example [2] or [1], [3]. After the table at most two sentences.'
  checklist: '- Form: Begin with one sentence that puts the matter in context. Structure the rest as a checklist, each item on its own line in the format: - [ ] Task – deadline – responsible office [n], with the source number at the end. Order the items by time, at most 10 items. Include only tasks that appear in the sources. Leave out the deadline or the office if the sources do not name it.'
  steps: '- Form: Begin with one sentence. Then describe the procedure as numbered steps (1., 2., 3.), one sentence per step with the responsible office and the source number [n], at most 8 steps. Include only steps that appear in the sources, and do not add any of your own.'
  mindmap: '- Form: Begin with one sentence. Then give an overview as a mind map in a code block that starts with ```mindmap and ends with ```. In the code block: one line # Topic, below it at most 6 areas as ## Area and below those at most 5 points per area as - Point [n] with the source number, no deeper levels.'
  shorter: '- Length: Shorten the answer to what matters most: tables, checklists and steps to at most half the rows, otherwise at most 3 sentences. Every source number stays with its statement.'
  longer: '- Length: Answer in more detail, deviating from the length above up to about 400 words, with all important details from the sources, each with its source number.'
  simple: '- Language: Write in plain language: short sentences, one thought per sentence, familiar words; explain technical terms briefly. Every source number stays with its statement.'
  english: '- Language: Answer completely in English, even if the question and the sources are German: the whole answer including tables, lists and mind map. Give German names of offices and titles of documents in brackets after the English translation. Every source number stays with its statement.'
  english_reminder: 'Answer in English only: the whole answer, although the sources are German.'
